name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # ruff is pinned: an unpinned install broke main when 0.16 widened
          # its default rule set. Bump deliberately, with a lint-clean commit.
          pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http pytest pyyaml ruff==0.16.0
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests/ -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Smoke-test the wheel
        run: |
          pip install dist/*.whl
          python -c "import hermes_otel; assert hasattr(hermes_otel, 'register')"
          python -c "from hermes_otel.cost import estimate_cost_usd; assert estimate_cost_usd('llama3.1:8b', 1000, 1000)"
